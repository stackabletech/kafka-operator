[workspace]
members = ["rust/operator-binary", "rust/agent-binary", "rust/tokio-kafka"]
resolver = "2"

[workspace.package]
version = "0.0.0-dev"
authors = ["Stackable GmbH <info@stackable.tech>"]
license = "OSL-3.0"
edition = "2024"
repository = "https://github.com/stackabletech/kafka-operator"

[workspace.dependencies]
stackable-operator = { git = "https://github.com/stackabletech/operator-rs.git", tag = "stackable-operator-0.116.0", features = ["crds", "webhook"] }
# The agent-binary crate depends on the operator crate for shared `crd` types + constants.
stackable-kafka-operator = { path = "rust/operator-binary" }

# Pure-Rust Kafka wire protocol (agent-binary). Replaces rdkafka + the JVM drain Job (spike R2.5):
# no librdkafka, no openssl-sys/pkg-config, builds in the plain sandbox.
kafka-protocol = "0.18"

anyhow = "1.0"
built = { version = "0.8", features = ["chrono", "git2"] }
bytes = "1.0"
clap = "4.6"
const_format = "0.2"
futures = "0.3"
indoc = "2.0"
rstest = "0.26"
rustls = "0.23"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
snafu = "0.9"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"

[patch."https://github.com/stackabletech/operator-rs.git"]
stackable-operator = { path = "../operator-rs/crates/stackable-operator" }
# stackable-operator = { git = "https://github.com/stackabletech//operator-rs.git", branch = "main" }
