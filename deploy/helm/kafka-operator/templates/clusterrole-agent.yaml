---
# Agent ClusterRole: bound (via per KafkaCluster RoleBinding) to the ServiceAccount that the
# agent pod runs as.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kafka-operator.name" . }}-agent-clusterrole
  labels:
  {{- include "kafka-operator.labels" . | nindent 4 }}
rules:
  # KafkaTopics of the agent's cluster: watched, annotated (ownership, managed config keys) and finalizers.
  - apiGroups:
      - {{ include "kafka-operator.name" . }}.stackable.tech
    resources:
      - kafkatopics
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - {{ include "kafka-operator.name" . }}.stackable.tech
    resources:
      - kafkatopics/status
    verbs:
      - patch
  # Required to report reconciliation errors as events on the KafkaTopic objects.
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
{{ if .Capabilities.APIVersions.Has "security.openshift.io/v1" }}
  # On OpenShift, the agent pod must be allowed to use the nonroot-v2 SCC
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - nonroot-v2
    verbs:
      - use
{{ end }}
