---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "operator.fullname" . }}-clusterrole
  labels:
  {{- include "operator.labels" . | nindent 4 }}
rules:
  # For automatic cluster domain detection
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
  # Manage core namespaced resources created per KafkaCluster.
  # Applied via SSA and tracked for orphan cleanup.
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - serviceaccounts
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # RoleBinding created per KafkaCluster to bind the product ClusterRole to the workload
  # ServiceAccount. Applied via SSA and tracked for orphan cleanup.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # Required to bind the product + agent ClusterRoles to the per-cluster ServiceAccounts. The operator
  # binds these pre-defined ClusterRoles (via namespaced RoleBindings) rather than minting Roles, so it
  # needs no privilege-escalation. `bind` is scoped to exactly these role names.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    verbs:
      - bind
    resourceNames:
      - {{ include "operator.name" . }}-clusterrole
      - {{ include "operator.name" . }}-agent-clusterrole
  # StatefulSet created per role group (broker, KRaft controller). Applied via
  # SSA, tracked for orphan cleanup, and owned by the controller.
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # PodDisruptionBudget created per role group. Applied via SSA and tracked for orphan cleanup.
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
  # Required for maintaining the CRDs within the operator (including the conversion webhook info).
  # Also for the startup condition check before the controller can run.
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      # Required to maintain the CRD. The operator needs to do this, as it needs to enter e.g. it's
      # generated certificate in the conversion webhook.
      {{- if .Values.maintenance.customResourceDefinitions.maintain }}
      - create
      - patch
      {{- end }}
      # Required for startup condition
      - list
      - watch
  # Required to report reconciliation results and warnings back to the KafkaCluster object.
  - apiGroups:
      - events.k8s.io
    resources:
      - events
    verbs:
      - create
      - patch
  # Primary CRD: watched by the controller and read during reconciliation.
  - apiGroups:
      - {{ include "operator.name" . }}.stackable.tech
    resources:
      - {{ include "operator.name" . }}clusters
    verbs:
      - get
      - list
      - watch
  # Status subresource: updated at the end of every reconciliation.
  - apiGroups:
      - {{ include "operator.name" . }}.stackable.tech
    resources:
      - {{ include "operator.name" . }}clusters/status
    verbs:
      - patch
  # SPIKE: the operator-side finalizer safety net watches KafkaTopics and releases their finalizer
  # once the owning KafkaCluster is gone (a namespaced agent cannot run its own finalizer during
  # namespace teardown). Read to watch; patch (incl. the finalizers subresource) to strip it.
  - apiGroups:
      - {{ include "operator.name" . }}.stackable.tech
    resources:
      - {{ include "operator.name" . }}topics
      - {{ include "operator.name" . }}topics/finalizers
    verbs:
      - get
      - list
      - watch
      - patch
  # Read authentication class configuration referenced in the KafkaCluster spec.
  - apiGroups:
      - authentication.stackable.tech
    resources:
      - authenticationclasses
    verbs:
      - get
  # Listener created per broker role group. Applied via SSA and tracked for orphan cleanup.
  # Fetched and watched by the controller, so a reconciliation is triggered once the
  # listener-operator writes the ingress addresses (needed for the discovery ConfigMap).
  - apiGroups:
      - listeners.stackable.tech
    resources:
      - listeners
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # SPIKE: the operator-rs Scaler state machine, driven per broker role group by the Scaler controller.
  - apiGroups:
      - autoscaling.stackable.tech
    resources:
      - scalers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - autoscaling.stackable.tech
    resources:
      - scalers/status
    verbs:
      - get
      - patch
      - update
  # SPIKE: the generic AgentRequest transport; the scaling hook creates/reads/deletes these, and the
  # Scaler controller owns (watches) them.
  - apiGroups:
      - platform.stackable.tech
    resources:
      - agentrequests
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  # SPIKE: the operator deploys the per-cluster kafka-agent (Deployment) and reads its liveness Lease.
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - patch
      - watch
