---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaCluster
metadata:
  name: simple-kafka
spec:
  image:
    productVersion: 4.3.1
  clusterConfig:
    metadataManager: KRaft
    managementAccess: # Deploys the agent, which creates and updates KafkaTopics in this cluster
      enabled: true
      authentication:
        userProvided:
          anonymous: {}
  controllers:
    roleGroups:
      default:
        replicas: 1
  brokers:
    config:
      bootstrapListenerClass: external-unstable # This exposes your Stacklet outside of Kubernetes. Remove this property if this is not desired
      brokerListenerClass: external-unstable # This exposes your Stacklet outside of Kubernetes. Remove this property if this is not desired
    roleGroups:
      default:
        replicas: 3
