---
# The agent authenticates to Kafka and creates the topic. The KafkaTopic keeps its finalizer until
# the end of the test, so the deletion of the namespace only finishes if the operator removes it.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
  finalizers:
    - kafka.stackable.tech/kafkatopic
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
  partitions: 3
