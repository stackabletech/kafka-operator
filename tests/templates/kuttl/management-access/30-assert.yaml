---
# Kafka rejects the requests of the agent, and the KafkaTopic reports why.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: kafka.stackable.tech/v1alpha1
    kind: KafkaTopic
    name: forbidden
    ref: forbidden
assertAll:
  - celExpr: "forbidden.status.conditions.exists(c, c.type == 'Synced' && c.message.contains('TopicAuthorizationFailed'))"
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: forbidden
status:
  conditions:
    - type: Ready
      status: Unknown
      reason: KafkaRejected
    - type: Synced
      status: "False"
      reason: KafkaRejected
