---
# Existing topics are adopted, and their topic-level configs are replaced. With the deletionPolicy
# Delete, the adopted topic gets a finalizer.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: kafka.stackable.tech/v1alpha1
    kind: KafkaTopic
    name: legacy
    ref: legacy
assertAll:
  - celExpr: legacy.status.topicId != ''
  - celExpr: "!has(legacy.status.config) || !('cleanup.policy' in legacy.status.config)"
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: legacy
  finalizers:
    - kafka.stackable.tech/kafkatopic
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
