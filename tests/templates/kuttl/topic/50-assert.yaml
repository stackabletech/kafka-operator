---
# The topic stays usable and unchanged.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "False"
      reason: UnsupportedChange
  partitions: 5
  replicationFactor: 1
