---
# While the agent is still running, it creates the topic and adds the finalizer.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: cleanup
  finalizers:
    - kafka.stackable.tech/kafkatopic
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
