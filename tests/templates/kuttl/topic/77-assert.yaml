---
# The topic stays available, and the status keeps the config observed in Kafka.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: defaults
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "False"
      reason: KafkaRejected
  config:
    retention.ms:
      source: DEFAULT_CONFIG
