---
# The agent only observes a paused topic, so the changed config is not applied.
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
spec:
  clusterRef:
    name: test-kafka
  topicName: orders
  partitions: 5
  replicationFactor: 1
  configOverrides:
    retention.ms: "10800000"
  topicOperation:
    reconciliationPaused: true
