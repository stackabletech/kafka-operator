---
# Ready is unknown, because the agent did not look at the topic in Kafka.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  - script: |
      topics=$(bash kafka-cli.sh kafka-topics.sh --list)
      ! echo "$topics" | grep -x throttled
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: throttled
status:
  conditions:
    - type: Ready
      status: Unknown
      reason: InvalidSpec
    - type: Synced
      status: "False"
      reason: InvalidSpec
