---
# Ready stays unknown, because the agent did not look at the topic in Kafka.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
commands:
  - script: bash topic-condition.sh throttled Synced False InvalidSpec
  - script: bash topic-condition.sh throttled Ready "" ""
  - script: |
      topics=$(bash kafka-cli.sh kafka-topics.sh --list)
      ! echo "$topics" | grep -x throttled
