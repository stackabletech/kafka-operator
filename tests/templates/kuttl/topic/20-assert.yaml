---
# With the default deletionPolicy Retain, the KafkaTopic has no finalizer.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: kafka.stackable.tech/v1alpha1
    kind: KafkaTopic
    name: orders
    ref: orders
assertAll:
  - celExpr: orders.status.topicId != ''
  - celExpr: "!has(orders.metadata.finalizers)"
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
  topicName: orders
  partitions: 3
  replicationFactor: 1
  config:
    retention.ms:
      value: "3600000"
      source: DYNAMIC_TOPIC_CONFIG
    max.message.bytes:
      value: "2097152"
      source: DYNAMIC_TOPIC_CONFIG
