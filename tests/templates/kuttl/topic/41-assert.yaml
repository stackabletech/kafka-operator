---
# The configOverrides replace all topic-level configs: the key removed from the spec and the key
# set out of band are both reset to the default.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
  config:
    retention.ms:
      value: "7200000"
      source: DYNAMIC_TOPIC_CONFIG
    max.message.bytes:
      source: DEFAULT_CONFIG
    segment.ms:
      source: DEFAULT_CONFIG
