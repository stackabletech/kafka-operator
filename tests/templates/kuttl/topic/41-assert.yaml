---
# The configOverrides replace all topic-level configs: the key removed from the spec and the key
# set out of band are both reset to the default.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: kafka.stackable.tech/v1alpha1
    kind: KafkaTopic
    name: orders
    ref: orders
assertAll:
  - celExpr: "!('max.message.bytes' in orders.status.config)"
  - celExpr: "!('segment.ms' in orders.status.config)"
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
  config:
    retention.ms: "7200000"
