---
# The status still shows the topic in Kafka, with the old config.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "False"
      reason: ReconciliationPaused
  config:
    retention.ms:
      value: "7200000"
      source: DYNAMIC_TOPIC_CONFIG
