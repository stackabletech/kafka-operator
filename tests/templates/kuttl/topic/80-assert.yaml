---
# The older KafkaTopic keeps managing the topic. The newer one gets no finalizer, so deleting it
# does not delete the topic.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
resourceRefs:
  - apiVersion: kafka.stackable.tech/v1alpha1
    kind: KafkaTopic
    name: orders-copy
    ref: orders_copy
assertAll:
  - celExpr: "!has(orders_copy.metadata.finalizers)"
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders-copy
status:
  conditions:
    - type: Ready
      status: "False"
      reason: Conflict
    - type: Synced
      status: "False"
      reason: Conflict
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
status:
  conditions:
    - type: Ready
      status: "True"
      reason: Available
    - type: Synced
      status: "True"
      reason: Synced
  config:
    retention.ms:
      value: "10800000"
      source: DYNAMIC_TOPIC_CONFIG
