---
# Throttles are set by partition reassignments and cannot be managed by a KafkaTopic.
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: throttled
spec:
  clusterRef:
    name: test-kafka
  topicName: throttled
  partitions: 1
  replicationFactor: 1
  configOverrides:
    leader.replication.throttled.replicas: "*"
