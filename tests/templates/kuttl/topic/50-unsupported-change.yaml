---
# Partitions cannot be removed, and the agent does not reassign replicas.
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: orders
spec:
  clusterRef:
    name: test-kafka
  topicName: orders
  partitions: 2
  replicationFactor: 3
  configOverrides:
    retention.ms: "7200000"
