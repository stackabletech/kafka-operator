---
# Without an agent, the operator sets the conditions of the remaining KafkaTopics.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
timeout: 300
---
apiVersion: kafka.stackable.tech/v1alpha1
kind: KafkaTopic
metadata:
  name: cleanup
status:
  conditions:
    - type: Ready
      status: Unknown
      reason: AgentUnavailable
    - type: Synced
      status: "False"
      reason: AgentUnavailable
