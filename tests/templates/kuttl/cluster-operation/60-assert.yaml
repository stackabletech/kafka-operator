---
# The recreated StatefulSet must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the KafkaCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available kafkaclusters.kafka.stackable.tech/test-kafka --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-kafka-broker-default
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-kafka-serviceaccount
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-kafka-rolebinding
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-kafka-broker
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: listeners.stackable.tech/v1alpha1
kind: Listener
metadata:
  name: test-kafka-broker-default-bootstrap
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-kafka
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: v1
kind: Service
metadata:
  name: test-kafka-broker-default-headless
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
---
apiVersion: v1
kind: Service
metadata:
  name: test-kafka-broker-default-metrics
  ownerReferences:
    - apiVersion: kafka.stackable.tech/v1alpha1
      controller: true
      kind: KafkaCluster
      name: test-kafka
